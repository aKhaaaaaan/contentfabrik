# Blender-Probe 12.11.2026 (Nutzer 09.11./11.11.): drei Business-Standbilder headless auf CPU rendern, Sekunden je
# Bild messen und nach Telegram schicken. Kein Einfluss auf die Produktion.
name: blenderprobe
on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Cycles-Samples je Bild'
        default: '24'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Blender holen (offizielles LTS-Paket)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 > /dev/null
          curl -sSfL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
          ./blender/blender --version | head -1
          nproc
      - name: Rendern
        env:
          SAMPLES: ${{ inputs.samples }}
        run: |
          case "$SAMPLES" in ''|*[!0-9]*) SAMPLES=24 ;; esac
          ./blender/blender -b --factory-startup -P fabrik/blenderprobe.py -- proben "$SAMPLES"
      # Runde 2 (12.11.): derselbe Malfilter "Gemalt+" wie bei den Clips, damit 3D zum gemalten Kanalstil passt.
      - name: Malfilter
        run: |
          pip install -q opencv-python-headless numpy
          python3 - <<'EOF'
          import json, sys, time
          import cv2
          sys.path.insert(0, 'fabrik')
          from archivclip import gemalt
          ergebnis = json.load(open('proben/blenderprobe.json', encoding='utf-8'))
          for e in ergebnis:
              start = time.time()
              ziel = e['datei'].replace('.jpg', '-gemalt.jpg')
              cv2.imwrite(f'proben/{ziel}', gemalt(cv2.imread(f"proben/{e['datei']}")))
              e['gemalt'], e['filter_s'] = ziel, round(time.time() - start, 1)
          json.dump(ergebnis, open('proben/blenderprobe.json', 'w', encoding='utf-8'), indent=1)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blenderprobe
          path: proben
      - name: In Telegram schicken
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, uuid
          token, chat = os.environ['TELEGRAM_BOT_TOKEN'], os.environ['TELEGRAM_CHAT_ID']
          def tg(methode, felder, datei=None):
              grenze = uuid.uuid4().hex
              teile = [f'--{grenze}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode() for k, v in felder.items()]
              if datei:
                  teile.append(f'--{grenze}\r\nContent-Disposition: form-data; name="photo"; filename="b.jpg"\r\n'
                               'Content-Type: image/jpeg\r\n\r\n'.encode() + open(datei, 'rb').read() + b'\r\n')
              teile.append(f'--{grenze}--\r\n'.encode())
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/{methode}', data=b''.join(teile),
                                           headers={'Content-Type': f'multipart/form-data; boundary={grenze}'})
              return json.load(urllib.request.urlopen(req, timeout=60))
          try:
              ergebnis = json.load(open('proben/blenderprobe.json', encoding='utf-8'))
          except OSError:
              ergebnis = []
          tg('sendMessage', {'chat_id': chat, 'text': '🧊 Blender-Probe Runde 2: waermer, dunkler, Chip ganz im Bild, '
                             'je Szene roh + mit Malfilter. Welche Fassung passt besser zum Kanal?'
                             if ergebnis else '🧊 Blender-Probe fehlgeschlagen - siehe GitHub-Log.'})
          for e in ergebnis:
              tg('sendPhoto', {'chat_id': chat, 'caption': f"{e['szene']} roh: {e['sekunden']} s ({e['samples']} Samples, "
                               f"Blender {e['blender']})"}, f"proben/{e['datei']}")
              if e.get('gemalt'):
                  tg('sendPhoto', {'chat_id': chat, 'caption': f"{e['szene']} gemalt (+{e['filter_s']} s)"},
                     f"proben/{e['gemalt']}")
          EOF
