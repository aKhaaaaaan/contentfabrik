# Blender-Probe 12.11.2026 (Nutzer 09.11./11.11.): drei Business-Standbilder headless auf CPU rendern, Sekunden je
# Bild messen und nach Telegram schicken. Kein Einfluss auf die Produktion.
name: blenderprobe
on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Cycles-Samples je Bild'
        default: '24'
      stil:
        description: 'toon (GTA-Plakat, Runde 3), real (Runde 2 + Malfilter), projektion (Runde 4: Codex-Gemaelde drehen)'
        type: choice
        options: [toon, real, projektion]
        default: toon
      vorlage:
        description: 'nur projektion: Release-Tag mit gemaelde.jpg (wird danach geloescht)'
        default: ''
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Blender holen (offizielles LTS-Paket)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 ffmpeg > /dev/null
          curl -sSfL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
          ./blender/blender --version | head -1
          nproc
      - name: Rendern
        env:
          SAMPLES: ${{ inputs.samples }}
          STIL: ${{ inputs.stil }}
          VORLAGE: ${{ inputs.vorlage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$SAMPLES" in ''|*[!0-9]*) SAMPLES=24 ;; esac
          case "$STIL" in real|projektion) ;; *) STIL=toon ;; esac
          if [ "$STIL" = projektion ]; then
            case "$VORLAGE" in blenderprojektion-[a-z0-9-]*) ;; *) echo "ungueltige Vorlage"; exit 1 ;; esac
            gh release download "$VORLAGE" -D vorlage
            # 12.11.: je Vorlage (vertrag/chip/regal.jpg, alt: gemaelde.jpg = chip) ein Drehclip; hin und zurueck
            # (6 s, 30 fps) laeuft nahtlos weiter, wenn eine Einstellung laenger dauert.
            mkdir -p proben  # GEMESSEN 12.11. (43250855082): Ordner entstand erst durch Blender
            echo '[]' > proben/alle.json
            for vorlage in vorlage/*.jpg; do
              name=$(basename "$vorlage" .jpg); szene=$name; [ "$name" = gemaelde ] && szene=chip
              case "$szene" in vertrag|chip|regal) ;; *) continue ;; esac
              ./blender/blender -b --factory-startup --python-exit-code 1 -P fabrik/blenderprobe.py -- proben "$SAMPLES" projektion "$vorlage" "$szene"
              ffmpeg -loglevel error -framerate 24 -i proben/proj/%04d.png -filter_complex "[0]split[a][b];[b]reverse[r];[a][r]concat=n=2:v=1,fps=30" -c:v libx264 -pix_fmt yuv420p -crf 20 "proben/$szene.mp4"
              rm -rf proben/proj
              python3 -c "import json;a=json.load(open('proben/alle.json'));e=json.load(open('proben/blenderprobe.json'))[0];e['datei']='$szene.mp4';a.append(e);json.dump(a,open('proben/alle.json','w'),indent=1)"
            done
            mv proben/alle.json proben/blenderprobe.json
            gh release delete "$VORLAGE" --yes --cleanup-tag || true
          else
            ./blender/blender -b --factory-startup --python-exit-code 1 -P fabrik/blenderprobe.py -- proben "$SAMPLES" "$STIL"
          fi
      # Runde 2 (12.11.): derselbe Malfilter "Gemalt+" wie bei den Clips, damit 3D zum gemalten Kanalstil passt.
      - name: Malfilter
        if: inputs.stil == 'real'
        run: |
          pip install -q opencv-python-headless numpy
          python3 - <<'EOF'
          import json, sys, time
          import cv2
          sys.path.insert(0, 'fabrik')
          from archivclip import gemalt
          ergebnis = json.load(open('proben/blenderprobe.json', encoding='utf-8'))
          for e in ergebnis:
              start = time.time()
              ziel = e['datei'].replace('.jpg', '-gemalt.jpg')
              cv2.imwrite(f'proben/{ziel}', gemalt(cv2.imread(f"proben/{e['datei']}")))
              e['gemalt'], e['filter_s'] = ziel, round(time.time() - start, 1)
          json.dump(ergebnis, open('proben/blenderprobe.json', 'w', encoding='utf-8'), indent=1)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blenderprobe
          path: proben
      - name: In Telegram schicken
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, uuid
          token, chat = os.environ['TELEGRAM_BOT_TOKEN'], os.environ['TELEGRAM_CHAT_ID']
          def tg(methode, felder, datei=None):
              grenze = uuid.uuid4().hex
              teile = [f'--{grenze}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode() for k, v in felder.items()]
              if datei:
                  feld, typ, name = ('video', 'video/mp4', 'p.mp4') if datei.endswith('.mp4') else ('photo', 'image/jpeg', 'b.jpg')
                  teile.append(f'--{grenze}\r\nContent-Disposition: form-data; name="{feld}"; filename="{name}"\r\n'
                               f'Content-Type: {typ}\r\n\r\n'.encode() + open(datei, 'rb').read() + b'\r\n')
              teile.append(f'--{grenze}--\r\n'.encode())
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/{methode}', data=b''.join(teile),
                                           headers={'Content-Type': f'multipart/form-data; boundary={grenze}'})
              return json.load(urllib.request.urlopen(req, timeout=60))
          try:
              ergebnis = json.load(open('proben/blenderprobe.json', encoding='utf-8'))
          except OSError:
              ergebnis = []
          stil = ergebnis[0].get('stil', 'real') if ergebnis else ''
          if stil != 'projektion':
              tg('sendMessage', {'chat_id': chat, 'text': ('🧊 Blender-Probe Runde 3: GTA-Plakatlook direkt in Blender '
                                 '(Toon-Schatten, Tuschelinien, Orange/Tuerkis). Besser als Runde 2?' if stil == 'toon' else
                                 '🧊 Blender-Probe: je Szene roh + mit Malfilter.')
                                 if ergebnis else '🧊 Blender-Probe fehlgeschlagen - siehe GitHub-Log.'})
          for e in ergebnis:
              if e['datei'].endswith('.mp4'):
                  tg('sendVideo', {'chat_id': chat, 'caption': f"🧊 Runde 4: Codex-Gemaelde auf 3D projiziert, Kamera "
                                   f"dreht {e['grad']} Grad je Seite. {e['bilder']} Bilder in {e['sekunden']} s "
                                   f"({e['je_bild']} s/Bild)"}, f"proben/{e['datei']}")
                  continue
              tg('sendPhoto', {'chat_id': chat, 'caption': f"{e['szene']} roh: {e['sekunden']} s ({e['samples']} Samples, "
                               f"Blender {e['blender']})"}, f"proben/{e['datei']}")
              if e.get('gemalt'):
                  tg('sendPhoto', {'chat_id': chat, 'caption': f"{e['szene']} gemalt (+{e['filter_s']} s)"},
                     f"proben/{e['gemalt']}")
          EOF
