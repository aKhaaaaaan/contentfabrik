# Woechentliches Business-Langvideo (8-10 Min.): die ganze Geschichte einer Firma, deren Short in den
# letzten Tagen lief (fabrik/langvideo.py). Gleiche Pruefungen wie die Shorts (Fakten, Story, Bild-Text,
# Technik, Endton), Zustellung als Video auf Telegram; Upload zu YouTube macht der Nutzer.
# Nutzerauftrag 16.10.2026: Langvideos zahlen je Aufruf ein Vielfaches und nur sie zaehlen fuer die
# Wiedergabestunden des Partnerprogramms.
name: langvideo
env:
  PYTHONUNBUFFERED: '1'
on:
  schedule:
    # Samstag nach den Tages-Shorts (die starten 08:23 UTC und brauchen bis ~11 Uhr). Sonntag ist der
    # Ersatztermin; die Vorpruefung startet nichts, wenn diese Woche schon ein Langvideo gesendet wurde.
    - cron: '7 12 * * 6'
    - cron: '7 12 * * 0'
  workflow_dispatch:
    inputs:
      thema:
        description: 'optional: festes Thema (leer = juengster Business-Short ohne Langvideo)'
        default: ''
concurrency:
  group: contentfabrik-zustand
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  vorpruefung:
    runs-on: ubuntu-latest
    outputs:
      faellig: ${{ steps.pruefen.outputs.faellig }}
      thema: ${{ steps.pruefen.outputs.thema }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: pruefen
        env:
          EINGABE: ${{ inputs.thema }}
        run: python3 fabrik/langvideo.py vorpruefung
  video:
    needs: vorpruefung
    if: needs.vorpruefung.outputs.faellig == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 230  # lauf.BUDGET_LANG_S 200 Min. plus Einrichtung/Sicherung
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Werkzeuge
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get -o Acquire::Retries=3 update -qq && \
            timeout 240 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-dejavu-core > /dev/null && break
            echo "apt-Versuch $i fehlgeschlagen"; sleep 10
          done
          command -v ffmpeg
          pip install -q -r requirements.txt
          npm install -g -s @anthropic-ai/claude-code || echo "Claude-CLI fehlt - Autor Gemini/Groq"
          python -m playwright install chromium --only-shell || echo "Playwright fehlt - ohne Aufnahmen"
      - uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - name: Modelle
        run: |
          mkdir -p modelle
          [ -f modelle/kokoro-v1.0.onnx ] || curl -sL -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f modelle/voices-v1.0.bin ] || curl -sL -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - uses: actions/cache/restore@v4
        id: ki-cache
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-lang
          restore-keys: ki-pruefungen-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: |
            produktions-cache/business-origin-stories
            stimm-cache
          key: teilbau-lang-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: teilbau-lang-v1-
      - name: Erzeugen, pruefen, senden
        id: produktion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_RESERVE: ${{ secrets.GEMINI_API_KEY_RESERVE }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: business-origin-stories
          THEMA: ${{ needs.vorpruefung.outputs.thema }}
          CF_WORKFLOW_STATUS: '1'
          CF_TEXT_FALLBACK: 'groq'
        run: python fabrik/lauf.py formate/business-origin-stories.json "$THEMA"
      - name: Abgebrochene Budgetreservierung abrechnen
        if: always() && steps.produktion.outcome == 'cancelled'
        env:
          CF_PRODUKTION_OUTCOME: ${{ steps.produktion.outcome }}
        run: python fabrik/budget.py abbruch lang-business-origin-stories
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            produktions-cache/business-origin-stories
            stimm-cache
          key: teilbau-lang-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always() && steps.ki-cache.outputs.cache-hit != 'true'
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-lang
      - name: Verlauf und Gelerntes sichern
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: business-origin-stories
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          git config merge.contentfabrik-themen.driver 'python fabrik/zustand_merge.py %O %A %B'
          for pfad in verlauf lernen themen vorrat; do
            [ ! -d "$pfad" ] || git add -- "$pfad"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "Verlauf/Lernen Langvideo business-origin-stories"
          for i in 1 2 3 4 5; do
            git pull -q --rebase || { git rebase --abort 2>/dev/null; break; }
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Verlauf und Budget konnten nicht gesichert werden" >&2
          python fabrik/stoerung.py verlauf-sichern \
            "Verlauf/Budget des Langvideos konnten nicht in Git gesichert werden (Konflikt)." \
            "Der Sonntagstermin koennte dasselbe Langvideo erneut bauen. Doppeltes Video in Telegram ablehnen."
          exit 1
      - name: Qualitaetsbericht
        if: always()
        run: python fabrik/bericht.py
      - name: Ergebnis ohne Video auf Telegram bestaetigen
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: business-origin-stories
          PRODUKTION: ${{ steps.produktion.outcome }}
          CF_ORIGINAL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python fabrik/statusmeldung.py tagesende
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langvideo-business-origin-stories
          retention-days: 3
          path: |
            ausgabe/short.mp4
            ausgabe/skript.json
            ausgabe/thumbnail*.jpg
            ausgabe/quellen.json
            ausgabe/messung.json
            ausgabe/bildablauf.json
            ausgabe/kritik.json
            ausgabe/bericht.json
            ausgabe/bildplan.json
            ausgabe/bildbezug.json
            ausgabe/*_abgelehnt_*.json
