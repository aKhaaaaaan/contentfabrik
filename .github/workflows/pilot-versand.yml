name: pilot-versand
run-name: Geprueftes Pilotvideo ${{ inputs.kanal }} / ${{ inputs.run_id }} auf Telegram
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Laufnummer des bereits erzeugten und visuell kontrollierten Piloten'
        required: true
        type: string
      kanal:
        type: choice
        options: [business-origin-stories, ai-tools-explained]
        required: true
      quelle:
        description: 'Artefakttyp des bereits erzeugten Videos'
        type: choice
        options: [pilot, video]
        default: pilot
      entwurf:
        description: 'Bestehenden Entwurfsmodus nutzen: nur KI-Geschmack, harte Gates bleiben'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: contentfabrik-pilot-versand
  cancel-in-progress: false
jobs:
  senden:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg fuer erforderliche Telegram-Kompression
        run: sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.quelle == 'video' && format('video-{0}', inputs.kanal) || format('pilot-{0}-short', inputs.kanal) }}
          path: pilotdateien
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
      - name: Erneut Freigabe pruefen und Videodatei senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ORIGINAL_URL: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
          CF_ENTWURF: ${{ inputs.entwurf && '1' || '0' }}
          SKRIPT_PFAD: ${{ inputs.quelle == 'video' && 'pilotdateien/skript.json' || 'pilotdateien/ausgabe/skript.json' }}
          VIDEO_PFAD: ${{ inputs.quelle == 'video' && 'pilotdateien/short.mp4' || 'pilotdateien/ausgabe/short.mp4' }}
        run: python fabrik/freigabe.py "$SKRIPT_PFAD" "$VIDEO_PFAD"
      - name: Telegram-Videozuordnung sichern
        if: always()
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          git config merge.contentfabrik-themen.driver 'python fabrik/zustand_merge.py %O %A %B'
          [ ! -f verlauf/telegram-videos.json ] || git add -- verlauf/telegram-videos.json
          git diff --cached --quiet && exit 0
          git commit -qm "Pilotversand: Telegram-Videozuordnung"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
