# Echter Produktionsbau und KI-Pruefung, ausschliesslich als private Artefakte.
# Optional Telegram nach bestandener Pruefung; kein Plattform-Upload, kein Zustands-Push.
name: pilot
run-name: Pilot ${{ inputs.kanal }} / ${{ inputs.videoformat }} / ${{ inputs.thema }}
on:
  workflow_dispatch:
    inputs:
      kanal:
        description: 'Kanal fuer den Qualitaets-Probelauf'
        type: choice
        options:
          - business-origin-stories
          - ai-tools-explained
        default: business-origin-stories
      videoformat:
        description: 'Format (lang = 8-10 Min., derzeit nur Business Origin Stories)'
        type: choice
        options:
          - short
          - lang
        default: short
      thema:
        description: 'Optional: festes Thema'
        default: ''
      telegram:
        description: 'Bestandenes Video, Skript und Upload-Texte auf Telegram senden'
        type: boolean
        default: false
      entwurf:
        description: 'Automatische Themenwahl oder unabhaengig zu pruefende redaktionelle Short-Vorlage'
        type: choice
        options:
          - automatisch
          - nintendo-karten
          - qwen-bildworkflow
        default: automatisch
permissions:
  contents: read
concurrency:
  group: contentfabrik-pilot
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # Langvideo: lauf.BUDGET_LANG_S (200 Min.) plus Einrichtung
    outputs:
      grund: ${{ steps.bericht.outputs.grund }}
      versand: ${{ steps.versand.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Zugang pruefen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}  # optional: bezahltes Projekt nur fuer die Stimme
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM: ${{ inputs.telegram }}
          KANAL: ${{ inputs.kanal }}
          VIDEOFORMAT: ${{ inputs.videoformat }}
          ENTWURF: ${{ inputs.entwurf }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "GEMINI_API_KEY fehlt" >&2; exit 1; }
          if [ "$TELEGRAM" = "true" ]; then
            [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || { echo "Telegram-Zugang fehlt" >&2; exit 1; }
          fi
          case "$KANAL" in business-origin-stories|ai-tools-explained) ;; *) exit 1 ;; esac
          case "$VIDEOFORMAT" in
            short) PROFIL="kanaele/$KANAL.json" ;;
            lang) PROFIL="formate/$KANAL.json" ;;
            *) exit 1 ;;
          esac
          [ -f "$PROFIL" ] || { echo "Kein Profil fuer diese Format-/Kanal-Kombination" >&2; exit 1; }
          case "$ENTWURF" in
            automatisch|'') ;;
            nintendo-karten) [ "$KANAL" = "business-origin-stories" ] && [ "$VIDEOFORMAT" = "short" ] || exit 1 ;;
            qwen-bildworkflow) [ "$KANAL" = "ai-tools-explained" ] && [ "$VIDEOFORMAT" = "short" ] || exit 1 ;;
            *) exit 1 ;;
          esac
          echo "PILOT_PROFIL=$PROFIL" >> "$GITHUB_ENV"
      - name: Start auf Telegram bestaetigen
        if: inputs.telegram
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ inputs.kanal }}
          VIDEOFORMAT: ${{ inputs.videoformat }}
          THEMA: ${{ inputs.thema }}
          CF_ORIGINAL_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python fabrik/statusmeldung.py start
      - name: Werkzeuge
        run: |
          timeout 240 sudo apt-get -o Acquire::Retries=3 update -qq
          timeout 240 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
          python -m playwright install chromium --only-shell
          npm install -g -s @anthropic-ai/claude-code || echo "Claude-CLI fehlt - Autor Gemini/Groq"
      - uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - uses: actions/cache/restore@v4
        id: ki-cache
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.kanal }}
          restore-keys: ki-pruefungen-v1-${{ runner.os }}-
      - name: Modelle
        run: |
          mkdir -p modelle
          [ -s modelle/kokoro-v1.0.onnx ] || curl --fail --location --retry 2 --max-time 180 -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s modelle/voices-v1.0.bin ] || curl --fail --location --retry 2 --max-time 180 -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - uses: actions/cache@v4
        with:
          path: clips
          key: clips-pilot-${{ inputs.kanal }}-${{ github.run_id }}
          restore-keys: clips-
      # Fortsetzen statt neu anfangen (09.10.2026): gepruefte Skripte, Teilbau und bezahlte
      # Stimmbloecke des letzten Probelaufs desselben Kanals/Formats (eigener Schluessel,
      # vermischt sich nie mit dem Tageslauf). Gueltigkeit regelt entwurf_cache (6 h).
      - uses: actions/cache/restore@v4
        with:
          path: |
            produktions-cache
            verlauf/entwuerfe
            verlauf/trendcheck
            stimm-cache
          key: teilbau-pilot-v1-${{ inputs.kanal }}-${{ inputs.videoformat }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: teilbau-pilot-v1-${{ inputs.kanal }}-${{ inputs.videoformat }}-
      - name: Video bauen, gezielt korrigieren und erneut pruefen
        env:
          CF_PILOT: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}  # optional: bezahltes Projekt nur fuer die Stimme
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # Skript-Autor wie im Tageslauf
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KANAL: ${{ inputs.kanal }}
          THEMA: ${{ inputs.thema }}
          ENTWURF: ${{ inputs.entwurf }}
        run: |
          if [ "$ENTWURF" = "nintendo-karten" ] || [ "$ENTWURF" = "qwen-bildworkflow" ]; then
            python fabrik/lauf.py "$PILOT_PROFIL" "$THEMA" "piloten/$ENTWURF.json"
          else
            python fabrik/lauf.py "$PILOT_PROFIL" "$THEMA"
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            produktions-cache
            verlauf/entwuerfe
            verlauf/trendcheck
            stimm-cache
          key: teilbau-pilot-v1-${{ inputs.kanal }}-${{ inputs.videoformat }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always() && steps.ki-cache.outputs.cache-hit != 'true'
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.kanal }}
      - name: Bericht
        id: bericht
        if: always()
        run: |
          python fabrik/bericht.py
          python fabrik/statusmeldung.py grund
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-${{ inputs.kanal }}-${{ inputs.videoformat }}
          retention-days: 3
          path: |
            ausgabe/short.mp4
            ausgabe/skript.json
            ausgabe/thumbnail*.jpg
            ausgabe/quellen.json
            ausgabe/messung.json
            ausgabe/dramaturgie.json
            ausgabe/bildablauf.json
            ausgabe/bildplan.json
            ausgabe/kritik.json
            ausgabe/audio-pruefung.json
            ausgabe/bericht.json
            ausgabe/korrektur.json
            ausgabe/untertitel.ass
            ausgabe/ill_*.jpg
            ausgabe/ill_*_abgelehnt_*.json
            lernen/*.json
            verlauf/messungen/*.json
      - name: Bestandenes Video und Skript auf Telegram senden
        id: versand
        if: success() && inputs.telegram
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ORIGINAL_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python fabrik/freigabe.py ausgabe/skript.json ausgabe/short.mp4
  fehlermeldung:
    needs: pruefen
    if: always() && inputs.telegram && needs.pruefen.result != 'success' && needs.pruefen.outputs.versand != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fehlgeschlagenen oder abgebrochenen Pilot melden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ inputs.kanal }}
          VIDEOFORMAT: ${{ inputs.videoformat }}
          THEMA: ${{ inputs.thema }}
          GRUND: ${{ needs.pruefen.outputs.grund }}
          CF_ORIGINAL_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python fabrik/statusmeldung.py fehlgeschlagen
