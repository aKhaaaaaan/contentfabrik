# Probelauf 1: baut ein Test-Short in GitHub Actions und misst die Rechenzeit.
# Manuell starten (workflow_dispatch). Ergebnis: Artefakt "probevideo".
name: probevideo
on:
  workflow_dispatch:
    inputs:
      skript:
        description: 'Skript-Datei'
        default: 'skripte/probe.json'
jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt
          # Bildschirmaufnahmen der Modellseiten (fabrik/bauen.py aufnahme_fuer):
          # nur der schlanke Browser; Chrome-Bibliotheken bringt der Runner mit
          python -m playwright install chromium --only-shell || echo "Playwright fehlt - ohne Aufnahmen"
      - name: Modelle (Kokoro, zwischengespeichert)
        uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - name: Modelle laden, falls nicht im Zwischenspeicher
        run: |
          mkdir -p modelle
          [ -f modelle/kokoro-v1.0.onnx ] || curl -sL -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f modelle/voices-v1.0.bin ] || curl -sL -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la modelle
      - name: Clip-Zwischenspeicher (Pixabay verlangt 24 h Zwischenspeicherung)
        uses: actions/cache@v4
        with:
          path: clips
          key: clips-${{ github.run_id }}
          restore-keys: clips-
      - name: Video bauen
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python fabrik/bauen.py "${{ inputs.skript || 'skripte/probe.json' }}" ausgabe
      - name: Ton pruefen (Lautstaerke der Stimme und des fertigen Videos)
        run: |
          echo "--- stimme.wav"; ffmpeg -hide_banner -i ausgabe/stimme.wav -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"
          echo "--- short.mp4"; ffmpeg -hide_banner -i ausgabe/short.mp4 -vn -af volumedetect -f null - 2>&1 | grep -E "Stream|mean_volume|max_volume"
      - uses: actions/upload-artifact@v4
        with:
          name: probevideo
          path: |
            ausgabe/short.mp4
            ausgabe/messung.json
            ausgabe/stimme.wav
            ausgabe/quellen.json
            ausgabe/effekte.wav
