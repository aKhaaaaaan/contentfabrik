# Probelauf 1: baut ein Test-Short in GitHub Actions und misst die Rechenzeit.
# Manuell starten (workflow_dispatch). Ergebnis: Artefakt "probevideo".
name: probevideo
on:
  workflow_dispatch:
jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt
      - name: Modelle (Kokoro, zwischengespeichert)
        uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - name: Modelle laden, falls nicht im Zwischenspeicher
        run: |
          mkdir -p modelle
          [ -f modelle/kokoro-v1.0.onnx ] || curl -sL -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f modelle/voices-v1.0.bin ] || curl -sL -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la modelle
      - name: Video bauen
        run: python fabrik/bauen.py skripte/probe.json ausgabe
      - uses: actions/upload-artifact@v4
        with:
          name: probevideo
          path: |
            ausgabe/short.mp4
            ausgabe/messung.json
