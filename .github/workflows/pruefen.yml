name: pruefen
on:
  push:
    paths:
      - 'fabrik/**'
      - 'pruefungen/**'
      - '.github/workflows/**'
      - 'cloudflare/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python -m unittest discover -s pruefungen -v
      - run: python -m compileall -q fabrik pruefungen
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node pruefungen/zeitplan.mjs
