name: pruefen
on:
  push:
    paths:
      - 'fabrik/**'
      - '.github/workflows/**'
      - 'cloudflare/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Tests und Doku liegen seit 10.10.2026 nur lokal (Nutzerentscheidung); online nur Kompilierpruefung.
      - run: python -m compileall -q fabrik
      - run: node --check cloudflare/zeitplan-worker.js
      - name: Anbieterzugang lesend pruefen (nur manuell)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python fabrik/zugang_pruefen.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: zugangscheck
          path: ausgabe/zugangscheck.json
          retention-days: 3
