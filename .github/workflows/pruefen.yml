name: pruefen
on:
  push:
    paths:
      - 'fabrik/**'
      - '.github/workflows/**'
      - 'cloudflare/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Tests und Doku liegen seit 10.10.2026 nur lokal (Nutzerentscheidung); online nur Kompilierpruefung.
      - run: python -m compileall -q fabrik
      - run: node --check cloudflare/zeitplan-worker.js
