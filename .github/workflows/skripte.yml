# Skript-Vorrat: Skripte nachts vorschreiben und pruefen (fabrik/vorrat.py).
# GEMELDET 07.10.2026: „Schreib die Skripte vorher, geprueft wartend."
# Nachts ist das Claude-Abo frei (tagsueber teilt es sich mit interaktiven
# Sitzungen - Lauf 37659694533 traf das Limit). 01:07/05:07 UTC = 03:07/07:07
# Berlin (Sommer), vor dem Videolauf 10:23. GitHub kann Zeitplaene verzoegern;
# dann schreibt der Videolauf wie bisher selbst.
name: skripte
on:
  schedule:
    - cron: '7 1,5 * * *'
  workflow_dispatch:
concurrency:
  group: contentfabrik-zustand
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  vorrat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Werkzeuge
        run: |
          pip install -q -r requirements.txt
          npm install -g -s @anthropic-ai/claude-code || echo "Claude-CLI fehlt - Autor Gemini/Groq"
      - name: Skripte schreiben und pruefen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_TEXT_FALLBACK: 'groq'
          CF_VORRAT_FRIST: '1000'
        run: python fabrik/vorrat.py
      - name: Vorrat sichern
        if: always()
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          for pfad in vorrat lernen; do
            [ ! -d "$pfad" ] || git add -- "$pfad"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "Skript-Vorrat aktualisiert"
          for i in 1 2 3 4 5; do
            git pull -q --rebase || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Vorrat konnte nicht gesichert werden" >&2
          exit 1
