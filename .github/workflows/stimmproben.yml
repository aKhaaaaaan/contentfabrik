# Hoerprobe: sechs Kokoro-Stimmen mit demselben Satz. Manuell starten.
name: stimmproben
on:
  workflow_dispatch:
jobs:
  proben:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - run: |
          mkdir -p modelle
          [ -f modelle/kokoro-v1.0.onnx ] || curl -sL -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f modelle/voices-v1.0.bin ] || curl -sL -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python fabrik/stimmproben.py proben
      - uses: actions/upload-artifact@v4
        with:
          name: stimmproben
          path: proben/*.wav
