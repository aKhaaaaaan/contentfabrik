# Themen-Nachrichten des Nutzers aus Telegram abholen (alle 4 Stunden).
# Telegram haelt unbestaetigte Nachrichten nur 24 h - einmal taeglich beim
# Video-Lauf zu lesen waere zu knapp. Kosten: ~1 Minute je Lauf.
name: themen
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
concurrency:
  group: contentfabrik-zustand
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  abholen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Nachrichten abholen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 fabrik/themen.py abholen
      - name: Erfolgszahlen abrufen (einmal taeglich)
        # Huckepack auf den Themen-Lauf: nur im Lauf gegen 12 Uhr UTC
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */4 * * *'
        continue-on-error: true
        env:
          YT_CLIENT: ${{ secrets.YT_CLIENT }}
          YT_TOKENS: ${{ secrets.YT_TOKENS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ "$(date -u +%H)" = "12" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || exit 0
          python3 fabrik/erfolg.py
      - name: Trend-Check Vorschau (nur bei manuellem Start, nichts wird gespeichert)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 fabrik/trendcheck.py business-origin-stories
          python3 fabrik/trendcheck.py ai-tools-explained
      - name: Warteschlange sichern
        id: sichern
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          for pfad in themen erfolg lernen; do
            [ ! -d "$pfad" ] || git add -- "$pfad"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "Themen: neue Nachrichten"
          for i in 1 2 3 4 5; do
            git pull -q --rebase || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Warteschlange konnte nicht gesichert werden" >&2
          exit 1
      - name: Gesicherte Nachrichten bestaetigen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 fabrik/themen.py bestaetigen
      - name: Bestaetigungsstand sichern
        if: always() && steps.sichern.outcome == 'success'
        run: |
          git add -- themen
          git diff --cached --quiet && exit 0
          git commit -qm "Themen: Telegram-Bestaetigungsstand"
          for i in 1 2 3 4 5; do
            git pull -q --rebase || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Bestaetigungsstand konnte nicht gesichert werden" >&2
          exit 1
