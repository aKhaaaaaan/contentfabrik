# Themen, Bewertungsknoepfe und Kommentare des Nutzers aus Telegram abholen.
# GEMELDET 10.10.2026: „4 Std. ist viel zu lang - wieso nicht in 5 Minuten?" Die 4 Std. sparten
# GitHub-Minuten, als das Repo privat war; oeffentlich sind sie unbegrenzt. Jetzt alle 5 Minuten
# und eine EIGENE Warteschlange - in 'contentfabrik-zustand' wartete die Abholung sonst hinter
# einem 1-2-stuendigen Videobau. Push-Konflikte faengt pull --rebase --autostash mit Wiederholung ab.
name: themen
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      automatisch:
        description: 'Zeitgeber-Abholung ohne wiederholte Tagesauswertung/Trendvorschau'
        type: boolean
        default: false
concurrency:
  group: contentfabrik-themen
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
  actions: read
jobs:
  abholen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Nachrichten abholen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_RESERVE: ${{ secrets.GEMINI_API_KEY_RESERVE }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}  # Reserve-Rueckfall, s. skript.reserve_schluessel
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 fabrik/themen.py abholen
      - name: Erfolgszahlen abrufen (einmal taeglich)
        id: erfolg
        # Huckepack auf den Themen-Lauf: nur im Lauf gegen 12 Uhr UTC
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
        continue-on-error: true
        env:
          AUTOMATISCH: ${{ github.event_name != 'workflow_dispatch' || inputs.automatisch }}
          YT_CLIENT: ${{ secrets.YT_CLIENT }}
          YT_TOKENS: ${{ secrets.YT_TOKENS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_RESERVE: ${{ secrets.GEMINI_API_KEY_RESERVE }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}  # Reserve-Rueckfall, s. skript.reserve_schluessel
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Einmal je Tag ab 12 Uhr UTC (Markierung in erfolg/, wird mitgesichert) - der 5-Minuten-Takt
          # wuerde sonst die YouTube-Analytics-Abfrage dutzendfach ausloesen.
          heute="$(date -u +%F)"
          if [ "$AUTOMATISCH" = 'true' ]; then
            [ "$(date -u +%H)" -ge 12 ] || exit 0
            [ "$(cat erfolg/.letzter_abruf 2>/dev/null)" != "$heute" ] || exit 0
          fi
          python3 fabrik/erfolg.py || true
          # Erinnerung TikTok-Umstellung ab 8.000 Followern (Entscheidung 10.10.2026), einmal je Tag
          python3 fabrik/tiktok_schwelle.py || true
          mkdir -p erfolg && echo "$heute" > erfolg/.letzter_abruf
          echo "abruf=1" >> "$GITHUB_OUTPUT"
      - name: Trend-Check Vorschau (nur bei manuellem Start, nichts wird gespeichert)
        if: github.event_name == 'workflow_dispatch' && inputs.automatisch != true
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 fabrik/trendcheck.py business-origin-stories
          python3 fabrik/trendcheck.py ai-tools-explained
      - name: Gemini wieder erreichbar melden
        # Nur nach einem an Gemini gescheiterten Videolauf (verlauf/gemini-wartet/), hoechstens alle 15 Min.
        if: hashFiles('verlauf/gemini-wartet/*.json') != ''
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 fabrik/gemini_wieder.py pruefen
      - name: Warteschlange sichern
        id: sichern
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          git config merge.contentfabrik-themen.driver 'python3 fabrik/zustand_merge.py %O %A %B'
          for pfad in themen erfolg lernen verlauf; do
            [ ! -d "$pfad" ] || git add -- "$pfad"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "Themen: neue Nachrichten"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Warteschlange konnte nicht gesichert werden" >&2
          exit 1
      - name: Gesicherte Nachrichten bestaetigen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 fabrik/themen.py bestaetigen
      - name: Bestaetigungsstand sichern
        if: always() && steps.sichern.outcome == 'success'
        run: |
          git add -- themen
          git diff --cached --quiet && exit 0
          git commit -qm "Themen: Telegram-Bestaetigungsstand"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Bestaetigungsstand konnte nicht gesichert werden" >&2
          exit 1
      - uses: actions/cache/restore@v4
        with:
          path: tiktok-token-cache
          key: tiktok-tokens-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tiktok-tokens-v1-
      - name: Bestaetigte TikTok-Entwuerfe hochladen und Status nachpruefen
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKENS: ${{ secrets.TIKTOK_TOKENS }}
          TIKTOK_TOKEN_CACHE: tiktok-token-cache/tokens.enc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Bei fehlender Freigabe oder Einrichtung kein Netz-/Paketaufruf.
          [ -n "$TIKTOK_CLIENT_KEY" ] && [ -n "$TIKTOK_CLIENT_SECRET" ] && [ -n "$TIKTOK_TOKENS" ] || exit 0
          python3 -c "import sys; sys.path.insert(0, 'fabrik'); from tiktok_freigabe import laden, offen; sys.exit(0 if any(offen(e) for e in laden()) else 1)" || exit 0
          python3 -m pip install -q cryptography==50.0.2
          python3 fabrik/tiktok.py freigaben
      - name: TikTok-Zahlen je Video abrufen (einmal taeglich)
        # 23.10.2026: video.list liefert Aufrufe/Likes/Teilungen je Video fuers Lernen (erfolg.tiktok_abrufen).
        # Hier statt im Erfolgsschritt, weil der rotierende TikTok-Token den Cache oben/unten braucht.
        if: steps.erfolg.outputs.abruf == '1'
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKENS: ${{ secrets.TIKTOK_TOKENS }}
          TIKTOK_TOKEN_CACHE: tiktok-token-cache/tokens.enc
        run: |
          [ -n "$TIKTOK_CLIENT_KEY" ] && [ -n "$TIKTOK_CLIENT_SECRET" ] && [ -n "$TIKTOK_TOKENS" ] || exit 0
          python3 -m pip install -q cryptography==50.0.2
          python3 fabrik/erfolg.py tiktok
      - name: Wochenbericht Publikum (montags, Telegram)
        # 30.10.2026: Massstab ist das Publikum - die Zahlen oben bekam bisher niemand zu sehen.
        if: steps.erfolg.outputs.abruf == '1'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 fabrik/wochenbericht.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('tiktok-token-cache/**') != ''
        with:
          path: tiktok-token-cache
          key: tiktok-tokens-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: TikTok-Uploadstand sichern
        if: always() && steps.sichern.outcome == 'success'
        run: |
          git add -- verlauf erfolg
          git diff --cached --quiet && exit 0
          git commit -qm "TikTok: bestaetigte Entwuerfe und Uploadstatus"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1
