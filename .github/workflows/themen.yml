# Themen-Nachrichten des Nutzers aus Telegram abholen (alle 4 Stunden).
# Telegram haelt unbestaetigte Nachrichten nur 24 h - einmal taeglich beim
# Video-Lauf zu lesen waere zu knapp. Kosten: ~1 Minute je Lauf.
name: themen
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  abholen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Nachrichten abholen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 fabrik/themen.py abholen
      - name: Warteschlange sichern
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          git add themen 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Themen: neue Nachrichten"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i * 5)); done
