# Ein Video je Kanal: Thema + Skript (Gemini) -> Faktenpruefung -> Video ->
# Freigabe aufs Handy (Telegram). Besteht das Skript die Pruefung nicht, wird
# kein Video gebaut (Konzept 4a) - der Nutzer bekommt dann eine Meldung.
name: video
env:
  PYTHONUNBUFFERED: '1'  # Fortschritt auch bei abgebrochenen Kindprozessen sichtbar
on:
  schedule:
    # GEMESSEN 03.10.2026: Der Lauf um 05:00 UTC fand gar nicht statt. GitHub
    # warnt selbst: zur vollen Stunde ist Hochlast, geplante Laeufe werden
    # verzoegert oder ausgelassen. Darum krumme Minute + Ersatztermin; die
    # Vorpruefung ueberspringt Kanaele, die heute schon ein Video haben.
    # GEMESSEN 04.10.2026: Das Gemini-Tageskontingent (20 Anfragen je Modell)
    # beginnt um Mitternacht Pazifikzeit = 07:00 UTC (Sommer) bzw. 08:00 UTC
    # (Winter). Die Laeufe um 04:23/06:41 UTC bekamen nur den Rest vom Vortag -
    # nach einem Testtag waren alle Flash-Modelle leer. 08:23 UTC liegt in
    # beiden Jahreszeiten nach dem Neustart; veroeffentlicht wird erst 15:00 NY.
    - cron: '23 8 * * *'   # 10:23 Berlin Sommer / 09:23 Winter
    - cron: '41 10 * * *'  # Ersatz, falls der erste ausfaellt
    # Freigabe ab Skript und Video 7/10 - weitere Fenster fuer Kanaele, die heute
    # noch kein freigegebenes Video haben (Vorpruefung ueberspringt alle anderen).
    - cron: '23 13 * * *'  # 15:23 Berlin
    - cron: '41 15 * * *'  # 17:41 Berlin - letzte Chance fuer 21:00 Veroeffentlichung
  workflow_dispatch:
    inputs:
      kanal:
        description: 'Kanal-Datei in kanaele/ (ohne .json)'
        default: 'business-origin-stories'
      thema:
        description: 'optional: festes Thema'
        default: ''
# Video- und Themen-Laeufe teilen dieselben Dateien: alle Schreiblaeufe seriell.
concurrency:
  group: contentfabrik-zustand
  cancel-in-progress: false
  queue: max  # wartende Themen-/Video-Laeufe nicht durch neuere Starts ersetzen
permissions:
  contents: write   # Themen-Verlauf zurueckschreiben
jobs:
  vorpruefung:
    runs-on: ubuntu-latest
    outputs:
      kanaele: ${{ steps.offen.outputs.kanaele }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: offen
        env:
          EREIGNIS: ${{ github.event_name }}
          EINGABE: ${{ inputs.kanal }}
          THEMA: ${{ inputs.thema }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'fabrik')
          import budget
          from lauf import start_moeglich
          def tagesziel(kanal):
              profil = json.loads(Path(f'kanaele/{kanal}.json').read_text(encoding='utf-8'))
              ziel = profil.get('tagesziel', 1)
              if type(ziel) is not int or ziel not in (1, 2):
                  raise ValueError('Tagesziel muss 1 oder 2 sein')
              return ziel
          alle = sorted(p.stem for p in Path('kanaele').glob('*.json'))
          heute = budget.heute()
          # kanal=alle: Start durch den Cloudflare-Zeitplan (puenktlich) - gleiche Regel wie schedule
          if os.environ['EREIGNIS'] == 'schedule' or os.environ['EINGABE'] == 'alle':
              offen = []
              for k in alle:
                  p = Path(f'verlauf/{k}.json')
                  v = json.loads(p.read_text(encoding='utf-8')) if p.exists() else []
                  # nur GESENDETE Videos zaehlen - verworfene Versuche nicht
                  if sum(e.get('datum') == heute and e.get('status') == 'gesendet' for e in v) < tagesziel(k) \
                          and start_moeglich(k):
                      offen.append(k)
          else:
              kanal = os.environ['EINGABE'] or 'business-origin-stories'
              if kanal not in alle:
                  raise SystemExit('Unbekannter Kanal')
              p = Path(f'verlauf/{kanal}.json')
              v = json.loads(p.read_text(encoding='utf-8')) if p.exists() else []
              gesendet = sum(e.get('datum') == heute and e.get('status') == 'gesendet' for e in v)
              offen = [kanal] if gesendet < tagesziel(kanal) and start_moeglich(kanal, os.environ.get('THEMA', '')) else []
          print('Offen:', offen)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'kanaele={json.dumps(offen)}\n')
          EOF
      - name: Tagesstart auf Telegram bestaetigen
        if: steps.offen.outputs.kanaele != '[]'
        # Eine Telegram-Stoerung soll die Videoproduktion nicht verhindern.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAELE: ${{ steps.offen.outputs.kanaele }}
          CF_ORIGINAL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 fabrik/statusmeldung.py tagesstart
  video:
    needs: vorpruefung
    if: needs.vorpruefung.outputs.kanaele != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 110  # Tagesbudget 90 Min. (lauf.BUDGET_S) plus Einrichtung/Sicherung
    strategy:
      fail-fast: false
      max-parallel: 1  # Warteschlange/Budget des vorherigen Kanals zuerst sichern
      matrix:
        kanal: ${{ fromJSON(needs.vorpruefung.outputs.kanaele) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Werkzeuge
        run: |
          # GEMESSEN 02.10.2026: apt hing 25+ Min. (Ubuntu-Spiegel) - je Versuch
          # hoechstens 4 Min., dann neu; sonst frisst ein Haenger den ganzen Lauf.
          for i in 1 2 3; do
            timeout 240 sudo apt-get -o Acquire::Retries=3 update -qq && \
            timeout 240 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-dejavu-core > /dev/null && break
            echo "apt-Versuch $i fehlgeschlagen"; sleep 10
          done
          command -v ffmpeg
          pip install -q -r requirements.txt
          # Claude Code CLI fuer den Skript-Autor (Abo-Token); faellt sonst auf Gemini/Groq zurueck
          npm install -g -s @anthropic-ai/claude-code || echo "Claude-CLI fehlt - Autor Gemini/Groq"
          # Bildschirmaufnahmen der Modellseiten (fabrik/bauen.py aufnahme_fuer):
          # nur der schlanke Browser; Chrome-Bibliotheken bringt der Runner mit
          python -m playwright install chromium --only-shell || echo "Playwright fehlt - ohne Aufnahmen"
      - uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - name: Modelle
        run: |
          mkdir -p modelle
          [ -f modelle/kokoro-v1.0.onnx ] || curl -sL -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f modelle/voices-v1.0.bin ] || curl -sL -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - uses: actions/cache@v4
        with:
          path: clips
          key: clips-${{ matrix.kanal }}-${{ github.run_id }}
          restore-keys: clips-
      - uses: actions/cache/restore@v4
        id: ki-cache
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kanal }}
          restore-keys: ki-pruefungen-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        id: bau-cache
        with:
          path: produktions-cache/${{ matrix.kanal }}
          key: teilbau-v1-${{ matrix.kanal }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: teilbau-v1-${{ matrix.kanal }}-
      - name: Erzeugen, pruefen, lernen, senden
        # Gepruefte Entwuerfe stehen im Repository; Medien ergaenzen den Teilbau.
        id: produktion
        # fabrik/lauf.py: Erstbau und bis zu 2 gezielte Korrekturen im Tagesbudget;
        # gesendet wird ab Story und Video 7/10, jeder Kategorie 7/10,
        # mit bestandenen Fakten- und Technikpruefungen.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}  # optional: bezahltes Projekt nur fuer die Stimme
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # Zweitpruefer (fabrik/zweit.py)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # Skript-Autor (fabrik/claude_ki.py)
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}  # Bilder (FLUX, Workers AI)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ matrix.kanal }}
          THEMA: ${{ inputs.thema }}
          CF_WORKFLOW_STATUS: '1'
          CF_TEXT_FALLBACK: 'groq'
        run: python fabrik/lauf.py "kanaele/${KANAL}.json" "$THEMA"
      - name: Tageslauf fuer die Qualitaetsserie erfassen
        if: always()
        env:
          KANAL: ${{ matrix.kanal }}
        run: python fabrik/qualitaetsserie.py erfassen "$KANAL"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: produktions-cache/${{ matrix.kanal }}
          key: teilbau-v1-${{ matrix.kanal }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always() && steps.ki-cache.outputs.cache-hit != 'true'
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kanal }}
      - name: Verlauf und Gelerntes sichern
        if: always()
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          for pfad in verlauf lernen themen vorrat; do
            [ ! -d "$pfad" ] || git add -- "$pfad"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "Verlauf/Lernen ${{ matrix.kanal }}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase || exit 1
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Verlauf und Budget konnten nicht gesichert werden" >&2
          exit 1
      - name: Qualitaetsbericht
        if: always()
        run: python fabrik/bericht.py
      - name: Ergebnis ohne Video auf Telegram bestaetigen
        # Qualitaetssperren koennen Exit 0 liefern: auch diese muessen gemeldet werden.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ matrix.kanal }}
          PRODUKTION: ${{ steps.produktion.outcome }}
          CF_ORIGINAL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python fabrik/statusmeldung.py tagesende
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ matrix.kanal }}
          # GEMESSEN: 16 Testlaeufe belegten 324 von 500 MB Gratis-Speicher.
          # Das Video liegt ohnehin in Telegram - 3 Tage reichen zum Nachsehen.
          retention-days: 3
          path: |
            ausgabe/short.mp4
            ausgabe/skript.json
            ausgabe/thumbnail*.jpg
            ausgabe/quellen.json
            ausgabe/messung.json
            ausgabe/bildablauf.json
            ausgabe/kritik.json
            ausgabe/audio-pruefung.json
            ausgabe/bericht.json
            ausgabe/korrektur.json
            ausgabe/qualitaetsserie.json
            ausgabe/bildplan.json
            ausgabe/bauzustand.json
            ausgabe/*_abgelehnt_*.json
            ausgabe/*_abgelehnt_*.jpg
