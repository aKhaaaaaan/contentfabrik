# Ein Video fuer einen Kanal: Thema + Skript (Gemini) -> Faktenpruefung -> Video.
# Besteht das Skript die Pruefung nicht, wird kein Video gebaut (Konzept 4a).
name: video
on:
  workflow_dispatch:
    inputs:
      kanal:
        description: 'Kanal-Datei in kanaele/ (ohne .json)'
        default: 'business-origin-stories'
      thema:
        description: 'optional: festes Thema'
        default: ''
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - name: Modelle
        run: |
          mkdir -p modelle
          [ -f modelle/kokoro-v1.0.onnx ] || curl -sL -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f modelle/voices-v1.0.bin ] || curl -sL -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - uses: actions/cache@v4
        with:
          path: clips
          key: clips-${{ github.run_id }}
          restore-keys: clips-
      - name: Skript schreiben und pruefen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fabrik/skript.py "kanaele/${{ inputs.kanal }}.json" ausgabe/skript.json "${{ inputs.thema }}"
      - name: Video bauen
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python fabrik/bauen.py ausgabe/skript.json ausgabe
      - name: Zur Freigabe aufs Handy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fabrik/freigabe.py ausgabe/skript.json ausgabe/short.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: |
            ausgabe/short.mp4
            ausgabe/skript.json
            ausgabe/quellen.json
            ausgabe/messung.json
