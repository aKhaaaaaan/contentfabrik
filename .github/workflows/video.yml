# Ein Video je Kanal: Thema + Skript (Gemini) -> Faktenpruefung -> Video ->
# Freigabe aufs Handy (Telegram). Besteht das Skript die Pruefung nicht, wird
# kein Video gebaut (Konzept 4a) - der Nutzer bekommt dann eine Meldung.
name: video
env:
  PYTHONUNBUFFERED: '1'  # Fortschritt auch bei abgebrochenen Kindprozessen sichtbar
on:
  schedule:
    # GEMESSEN 03.10.2026: Der Lauf um 05:00 UTC fand gar nicht statt. GitHub
    # warnt selbst: zur vollen Stunde ist Hochlast, geplante Laeufe werden
    # verzoegert oder ausgelassen. Darum krumme Minute + Ersatztermin; die
    # Vorpruefung ueberspringt Kanaele, die heute schon ein Video haben.
    # GEMESSEN 04.10.2026: Das Gemini-Tageskontingent (20 Anfragen je Modell)
    # beginnt um Mitternacht Pazifikzeit = 07:00 UTC (Sommer) bzw. 08:00 UTC
    # (Winter). Die Laeufe um 04:23/06:41 UTC bekamen nur den Rest vom Vortag -
    # nach einem Testtag waren alle Flash-Modelle leer. 08:23 UTC liegt in
    # beiden Jahreszeiten nach dem Neustart; veroeffentlicht wird erst 15:00 NY.
    - cron: '23 8 * * *'   # 10:23 Berlin Sommer / 09:23 Winter
    - cron: '41 10 * * *'  # Ersatz, falls der erste ausfaellt
    # Freigabe ab Skript und Video 7/10 - weitere Fenster fuer Kanaele, die heute
    # noch kein freigegebenes Video haben (Vorpruefung ueberspringt alle anderen).
    - cron: '23 13 * * *'  # 15:23 Berlin
    - cron: '41 15 * * *'  # 17:41 Berlin - letzte Chance fuer 21:00 Veroeffentlichung
  workflow_dispatch:
    inputs:
      kanal:
        description: 'Kanal-Datei in kanaele/ (ohne .json)'
        default: 'business-origin-stories'
      thema:
        description: 'optional: festes Thema'
        default: ''
      bezahlt:
        description: 'ja = auch nach aufgebrauchtem Gratis-Kontingent starten (bezahltes Google-Projekt)'
        default: ''
      quelle:
        description: 'zeitplan = Cloudflare-Zeitplan, hand = Telegram-Start; leer = an der Uhrzeit erkennen'
        default: ''
# Video- und Themen-Laeufe teilen dieselben Dateien: alle Schreiblaeufe seriell.
concurrency:
  group: contentfabrik-zustand
  cancel-in-progress: false
  queue: max  # wartende Themen-/Video-Laeufe nicht durch neuere Starts ersetzen
permissions:
  contents: write   # Themen-Verlauf zurueckschreiben
jobs:
  vorpruefung:
    runs-on: ubuntu-latest
    outputs:
      kanaele: ${{ steps.offen.outputs.kanaele }}
      hand: ${{ steps.offen.outputs.hand }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: offen
        env:
          EREIGNIS: ${{ github.event_name }}
          # nur fuer die Kontohash-Zuordnung der gespeicherten Gemini-Sperren (kontingent.py), keine Anfrage
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEZAHLT: ${{ inputs.bezahlt }}
          QUELLE: ${{ inputs.quelle }}
          EINGABE: ${{ inputs.kanal }}
          THEMA: ${{ inputs.thema }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'fabrik')
          import budget, themen
          from lauf import start_moeglich, extra_videos
          def tagesziel(kanal):
              profil = json.loads(Path(f'kanaele/{kanal}.json').read_text(encoding='utf-8'))
              ziel = profil.get('tagesziel', 1)
              if type(ziel) is not int or ziel not in (1, 2):
                  raise ValueError('Tagesziel muss 1 oder 2 sein')
              return ziel + extra_videos(kanal, budget.heute())  # datumsgebundene Nutzerausnahme
          alle = sorted(p.stem for p in Path('kanaele').glob('*.json'))
          heute = budget.heute()
          import datetime, kontingent, statusmeldung
          # Handstart (Telegram „start" / GitHub) statt Zeitplan: Nutzerwunsch 21.10.2026 - weitere Videos,
          # solange das kostenlose Kontingent reicht. Der Zeitplan bleibt beim Tagesziel.
          # GEMESSEN 23.10.2026: Telegram-Start 15:45 UTC fiel ins 10-Min.-Fenster nach dem 15:41-Zeitplan und galt
          # als Zeitplan-Start -> Tagesziel erreicht, kein Video. Der Worker sagt jetzt, woher der Start kommt;
          # nur Starts ohne Angabe (GitHub-Oberflaeche, alter Worker) werden noch an der Uhrzeit erkannt.
          quelle = os.environ.get('QUELLE', '')
          hand = os.environ['EREIGNIS'] != 'schedule' and quelle != 'zeitplan' and (
              quelle == 'hand' or not statusmeldung.zeitplan_start(datetime.datetime.now(datetime.timezone.utc)))
          # „start ki bezahlt": Nutzer hat nach der Gratis-Meldung ausdruecklich einen kostenpflichtigen Lauf
          # gewaehlt - die Reserve (bezahltes Projekt, skript.reserve_schluessel) traegt dann die Anfragen.
          gratis_weg = kontingent.gemini_frei() if hand and os.environ.get('BEZAHLT') != 'ja' else None
          if hand:
              os.environ['CF_HANDSTART'] = '1'  # neues Zeitfenster je geliefertem Video nur fuer Handstarts (lauf.tagesgrenze)
          if gratis_weg:
              print('Kostenloses Kontingent:', gratis_weg)
          # kanal=alle: Start durch den Cloudflare-Zeitplan (puenktlich) - gleiche Regel wie schedule
          if os.environ['EREIGNIS'] == 'schedule' or os.environ['EINGABE'] == 'alle':
              offen = []
              for k in alle:
                  p = Path(f'verlauf/{k}.json')
                  v = json.loads(p.read_text(encoding='utf-8')) if p.exists() else []
                  # nur GESENDETE Videos zaehlen - verworfene Versuche nicht
                  if (sum(themen.zaehlt_als_tagesvideo(k, e, heute) for e in v) < tagesziel(k) or hand) \
                          and not gratis_weg and start_moeglich(k):
                      offen.append(k)
          else:
              kanal = os.environ['EINGABE'] or 'business-origin-stories'
              if kanal not in alle:
                  raise SystemExit('Unbekannter Kanal')
              p = Path(f'verlauf/{kanal}.json')
              v = json.loads(p.read_text(encoding='utf-8')) if p.exists() else []
              # Wiederholung eines schon gelieferten Themas zaehlt nicht als Tagesvideo (16.10.2026, Airbnb).
              gesendet = sum(themen.zaehlt_als_tagesvideo(kanal, e, heute) for e in v)
              offen = [kanal] if (gesendet < tagesziel(kanal) or hand) and not gratis_weg \
                  and start_moeglich(kanal, os.environ.get('THEMA', '')) else []
          print('Offen:', offen)
          # Stand je Kanal fuer die Meldung "kein neues Video gestartet" (Handstart, 20.10.2026)
          from lauf import tagesgrenze, BUDGET_S
          stand = []
          for k in (alle if os.environ['EINGABE'] == 'alle' or os.environ['EREIGNIS'] == 'schedule'
                    else [os.environ['EINGABE'] or 'business-origin-stories']):
              p = Path(f'verlauf/{k}.json')
              v = json.loads(p.read_text(encoding='utf-8')) if p.exists() else []
              stand.append({'kanal': k, 'gesendet': sum(themen.zaehlt_als_tagesvideo(k, e, heute) for e in v),
                            'ziel': tagesziel(k), 'verbraucht_min': round(budget.laden(k)['sekunden'] / 60),
                            'grenze_min': round(tagesgrenze(k, BUDGET_S) / 60), 'gratis': gratis_weg})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'stand={json.dumps(stand)}\n')
              f.write(f'hand={json.dumps(hand)}\n')
              f.write(f'kanaele={json.dumps(offen)}\n')
          EOF
      - name: Handstart ohne neues Video erklaeren
        if: steps.offen.outputs.kanaele == '[]' && steps.offen.outputs.hand == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAND: ${{ steps.offen.outputs.stand }}
        run: python3 fabrik/statusmeldung.py kein_start
      - name: Tagesstart auf Telegram bestaetigen
        if: steps.offen.outputs.kanaele != '[]'
        # Eine Telegram-Stoerung soll die Videoproduktion nicht verhindern.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAELE: ${{ steps.offen.outputs.kanaele }}
          CF_ORIGINAL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 fabrik/statusmeldung.py tagesstart
  video:
    needs: vorpruefung
    if: needs.vorpruefung.outputs.kanaele != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 110  # Tagesbudget 90 Min. (lauf.BUDGET_S) plus Einrichtung/Sicherung
    strategy:
      fail-fast: false
      max-parallel: 1  # Warteschlange/Budget des vorherigen Kanals zuerst sichern
      matrix:
        kanal: ${{ fromJSON(needs.vorpruefung.outputs.kanaele) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Werkzeuge
        run: |
          # GEMESSEN 02.10.2026: apt hing 25+ Min. (Ubuntu-Spiegel) - je Versuch
          # hoechstens 4 Min., dann neu; sonst frisst ein Haenger den ganzen Lauf.
          for i in 1 2 3; do
            timeout 240 sudo apt-get -o Acquire::Retries=3 update -qq && \
            timeout 240 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-dejavu-core > /dev/null && break
            echo "apt-Versuch $i fehlgeschlagen"
            # GEMESSEN 24.10.2026 (Lauf 40108829296): der Azure-Spiegel hing 3x 240 s, das Langvideo fiel ohne
            # Bau aus. Ab dem zweiten Versuch den Ubuntu-Hauptserver nehmen.
            sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g'               /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 10
          done
          command -v ffmpeg
          pip install -q -r requirements.txt
          # Lokale Schrifterkennung vor der Gemini-Bildpruefung (16.10.2026). --no-deps + headless-OpenCV:
          # rapidocr verlangt opencv-python, das auf Linux libGL braucht. Fehlt es, prueft Gemini allein.
          pip install -q --no-deps rapidocr_onnxruntime==1.2.3 && pip install -q opencv-python-headless==5.0.0.93 pyclipper==1.4.0 shapely==2.2.0 PyYAML==6.0.3 six==1.17.0 || echo "Schrifterkennung fehlt - nur Gemini-Pruefung"
          # Versionen ins Log (09.10.2026: ungepinnte Pakete; Grundlage zum Festlegen)
          pip freeze | grep -i -E "^(kokoro|faster-whisper|av|pillow|numpy|playwright|onnxruntime|ctranslate2)" || true
          # Claude Code CLI fuer den Skript-Autor (Abo-Token); faellt sonst auf Gemini/Groq zurueck
          npm install -g -s @anthropic-ai/claude-code || echo "Claude-CLI fehlt - Autor Gemini/Groq"
          # Bildschirmaufnahmen der Modellseiten (fabrik/bauen.py aufnahme_fuer):
          # nur der schlanke Browser; Chrome-Bibliotheken bringt der Runner mit
          python -m playwright install chromium --only-shell || echo "Playwright fehlt - ohne Aufnahmen"
      - uses: actions/cache@v4
        with:
          path: modelle
          key: kokoro-v1.0
      - name: Modelle
        run: |
          mkdir -p modelle
          [ -f modelle/kokoro-v1.0.onnx ] || curl -sL -o modelle/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f modelle/voices-v1.0.bin ] || curl -sL -o modelle/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      # Nutzerentscheidung 29.10.2026: Archivclips werden mit DDColor eingefaerbt. Seit 31.10. fuer alle Kanaele
      # (Zeichentrick-/Comedy-Clips auch im KI-Kanal). Scheitert die Einrichtung, fehlt CF_DDCOLOR: gemalte Bilder.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ddcolor-modelscope-v1
      - name: Archivclips (DDColor)
        continue-on-error: true
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q huggingface-hub scikit-image pyyaml scipy tqdm
          git clone -q https://github.com/piddnad/DDColor ddcolor-code
          git -C ddcolor-code checkout -q 2adb63f2656ac41cbdf7b894cddd94121a3faf13
          echo "CF_DDCOLOR=$PWD/ddcolor-code" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: clips
          key: clips-${{ matrix.kanal }}-${{ github.run_id }}
          restore-keys: clips-
      - uses: actions/cache/restore@v4
        id: ki-cache
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kanal }}
          restore-keys: ki-pruefungen-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        id: bau-cache
        with:
          path: |
            produktions-cache/${{ matrix.kanal }}
            stimm-cache
          key: teilbau-v1-${{ matrix.kanal }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: teilbau-v1-${{ matrix.kanal }}-
      - name: Erzeugen, pruefen, lernen, senden
        # Gepruefte Entwuerfe stehen im Repository; Medien ergaenzen den Teilbau.
        id: produktion
        # fabrik/lauf.py: Erstbau und bis zu 2 gezielte Korrekturen im Tagesbudget;
        # gesendet wird ab Story und Video 7/10, jeder Kategorie 7/10,
        # mit bestandenen Fakten- und Technikpruefungen.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_RESERVE: ${{ secrets.GEMINI_API_KEY_RESERVE }}
          GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}  # optional: bezahltes Projekt nur fuer die Stimme
          # Nutzerentscheidung 21.10.2026: Handstart-Zusatzvideo ohne „bezahlt" -> keine bezahlte Gemini-Reserve
          # (skript.reserve_schluessel). Zeitplanvideo und „start ki bezahlt" behalten sie.
          CF_RESERVE_AUS: ${{ needs.vorpruefung.outputs.hand == 'true' && inputs.bezahlt != 'ja' && '1' || '' }}
          CF_HANDSTART: ${{ needs.vorpruefung.outputs.hand == 'true' && '1' || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # Zweitpruefer (fabrik/zweit.py)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # Skript-Autor (fabrik/claude_ki.py)
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}  # Bilder (FLUX, Workers AI)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ matrix.kanal }}
          THEMA: ${{ inputs.thema }}
          CF_WORKFLOW_STATUS: '1'
          CF_TEXT_FALLBACK: 'groq'
        run: python fabrik/lauf.py "kanaele/${KANAL}.json" "$THEMA"
      - name: Abgebrochene Budgetreservierung abrechnen
        if: always() && steps.produktion.outcome == 'cancelled'
        env:
          KANAL: ${{ matrix.kanal }}
          CF_PRODUKTION_OUTCOME: ${{ steps.produktion.outcome }}
        run: python fabrik/budget.py abbruch "$KANAL"
      - name: Tageslauf fuer die Qualitaetsserie erfassen
        if: always()
        env:
          KANAL: ${{ matrix.kanal }}
        run: python fabrik/qualitaetsserie.py erfassen "$KANAL"
      - name: TikTok-Freigabestatus vorbereiten
        if: steps.produktion.outcome == 'success'
        continue-on-error: true
        env:
          KANAL: ${{ matrix.kanal }}
        run: python fabrik/tiktok.py tageslauf "$KANAL"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            produktions-cache/${{ matrix.kanal }}
            stimm-cache
          key: teilbau-v1-${{ matrix.kanal }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always() && steps.ki-cache.outputs.cache-hit != 'true'
        with:
          path: ki-cache
          key: ki-pruefungen-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kanal }}
      - name: Verlauf und Gelerntes sichern
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ matrix.kanal }}
          PRODUKTION: ${{ steps.produktion.outcome }}
        run: |
          git config user.name 'contentfabrik-bot'
          git config user.email 'contentfabrik-bot@users.noreply.github.com'
          git config merge.contentfabrik-themen.driver 'python fabrik/zustand_merge.py %O %A %B'
          # Ohne Video wegen Gemini: Merker fuer die Meldung „Gemini wieder erreichbar" (themen.yml)
          python fabrik/gemini_wieder.py merken || true
          for pfad in verlauf lernen themen vorrat; do
            [ ! -d "$pfad" ] || git add -- "$pfad"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "Verlauf/Lernen ${{ matrix.kanal }}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase || { git rebase --abort 2>/dev/null; break; }
            git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Verlauf und Budget konnten nicht gesichert werden" >&2
          # GEMELDET 16.10.2026: Ein Git-Konflikt verschluckte den Versandeintrag des KI-Videos; der
          # Nachhol-Lauf 12:41 hielt den Kanal fuer offen und schickte dasselbe Video noch einmal.
          python fabrik/stoerung.py verlauf-sichern \
            "Verlauf/Budget von ${{ matrix.kanal }} konnten nicht in Git gesichert werden (Konflikt)." \
            "Ein spaeterer Lauf koennte dasselbe Video erneut bauen. Doppeltes Video in Telegram ablehnen."
          exit 1
      - name: Qualitaetsbericht
        if: always()
        run: python fabrik/bericht.py
      - name: Ergebnis ohne Video auf Telegram bestaetigen
        # Qualitaetssperren koennen Exit 0 liefern: auch diese muessen gemeldet werden.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ matrix.kanal }}
          PRODUKTION: ${{ steps.produktion.outcome }}
          CF_ORIGINAL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Kontohash fuer „noch ein Gratis-Video?" (kontingent.py)
        run: python fabrik/statusmeldung.py tagesende
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ matrix.kanal }}
          # GEMESSEN: 16 Testlaeufe belegten 324 von 500 MB Gratis-Speicher.
          # Das Video liegt ohnehin in Telegram - 3 Tage reichen zum Nachsehen.
          retention-days: 3
          path: |
            ausgabe/short.mp4
            ausgabe/skript.json
            ausgabe/thumbnail*.jpg
            ausgabe/quellen.json
            ausgabe/messung.json
            ausgabe/bildablauf.json
            ausgabe/kritik.json
            ausgabe/audio-pruefung.json
            ausgabe/bericht.json
            ausgabe/tiktok.json
            ausgabe/tiktok-text.txt
            ausgabe/korrektur.json
            ausgabe/qualitaetsserie.json
            ausgabe/bildplan.json
            ausgabe/bildbezug.json
            ausgabe/bauzustand.json
            ausgabe/*_abgelehnt_*.json
            ausgabe/*_abgelehnt_*.jpg
