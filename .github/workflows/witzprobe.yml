# Witz-Probe 31.10.2026 (Nutzer: Zeichentrick-/Comedy-Clips in Shorts und Langvideos beider Kanaele): echte
# Clip-Suche fuer Beispielsaetze, gemalte Treffer nach Telegram. Kein Video, kein Upload, beruehrt weder Verlauf
# noch Budget der Produktion. Laeuft auf dem Branch mit dem neuen Code (ref beim Start).
name: witzprobe
on:
  workflow_dispatch:
concurrency:
  group: witzprobe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ddcolor-modelscope-v1
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          pip install -q opencv-python-headless==5.0.0.93
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q huggingface-hub scikit-image pyyaml scipy tqdm
          git clone -q https://github.com/piddnad/DDColor ddcolor-code
          git -C ddcolor-code checkout -q 2adb63f2656ac41cbdf7b894cddd94121a3faf13
          echo "CF_DDCOLOR=$PWD/ddcolor-code" >> "$GITHUB_ENV"
      - name: Clips suchen, malen, senden
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fabrik/witzprobe.py probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: witzprobe
          path: probe
